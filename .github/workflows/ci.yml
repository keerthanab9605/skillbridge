name: CI/CD
on:
  push: { branches: [main] }
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npm run check
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npm run build   # type-check + production build
        env: { VITE_API_URL: https://your-api.onrender.com }
  docker:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build ./backend -t skillbridge-api
      - run: docker build ./frontend -t skillbridge-web
  # Deployment: Vercel (frontend) and Render (backend) auto-deploy from the main branch once connected.
  # Because the deploy jobs sit behind this pipeline when "Wait for CI" is enabled, a failing build never goes live.
