services:
  mongo:
    image: mongo:7
    volumes: [mongo-data:/data/db]
  api:
    build: ./backend
    environment:
      MONGO_URI: mongodb://mongo:27017/skillbridge
      JWT_SECRET: change-me-in-production
      CLIENT_URL: http://localhost:8080
    ports: ["5000:5000"]
    depends_on: [mongo]
    volumes: [uploads:/app/uploads]
  web:
    build:
      context: ./frontend
      args: { VITE_API_URL: http://localhost:5000 }
    ports: ["8080:80"]
    depends_on: [api]
volumes:
  mongo-data:
  uploads:
